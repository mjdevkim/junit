# 테스트용 DB 설정
spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver  # 메모리에 테스트용 DB를 만든다 - Postgres 서버 없이 테스트 가능
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop # JPA 초기화시 엔티티를 보고 테이블을 만들고, 종료시 삭제한다
    defer-datasource-initialization: true # 테이블을 만들고, data.sql를 실행한다

  sql:
    init:
      mode: always # SQL 초기화 스크립트를 실행하도록 설정한다